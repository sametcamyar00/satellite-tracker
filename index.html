<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISS Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 255, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 220px;
      font-family: 'Courier New', monospace;
      color: #fff;
      z-index: 10;
    }
    #hud .hud-title {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 10px;
    }
    #hud .hud-name {
      font-size: 15px;
      font-weight: bold;
      color: #00ffff;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
    #hud .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 7px;
      gap: 16px;
    }
    #hud .hud-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      flex-shrink: 0;
    }
    #hud .hud-value {
      font-size: 13px;
      color: #e0f7ff;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #hud .hud-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 10px 0;
    }
    #hud .hud-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #00ffff;
      border-radius: 50%;
      margin-right: 7px;
      box-shadow: 0 0 6px #00ffff;
      animation: pulse 2s ease-in-out infinite;
    }

    #hud .hud-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #hud .hud-badge-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    #hud .hud-badge {
      background: rgba(255, 204, 0, 0.15);
      border: 1px solid rgba(255, 204, 0, 0.45);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: bold;
      color: #ffcc00;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #tooltip {
      position: fixed;
      pointer-events: none;
      display: none;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 204, 0, 0.4);
      border-radius: 8px;
      padding: 9px 13px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #fff;
      z-index: 20;
      white-space: nowrap;
      transform: translate(14px, -50%);
    }
    #tooltip .tt-name {
      font-weight: bold;
      color: #ffcc00;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    #tooltip .tt-alt {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.08em;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js/dist/satellite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="tooltip">
    <div class="tt-name" id="tt-name"></div>
    <div class="tt-alt" id="tt-alt"></div>
  </div>

  <div id="hud">
    <div class="hud-title">Live Tracking</div>
    <div class="hud-name"><span class="hud-dot"></span>ISS (ZARYA)</div>
    <hr class="hud-divider">
    <div class="hud-row">
      <span class="hud-label">Altitude</span>
      <span class="hud-value" id="hud-alt">— km</span>
    </div>
    <hr class="hud-divider">
    <div class="hud-row">
      <span class="hud-label">X</span>
      <span class="hud-value" id="hud-x">—</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">Y</span>
      <span class="hud-value" id="hud-y">—</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">Z</span>
      <span class="hud-value" id="hud-z">—</span>
    </div>
    <div class="hud-badge-row">
      <span class="hud-badge-label">Tracking</span>
      <span class="hud-badge" id="hud-count">—</span>
    </div>
  </div>

  <script>
    // --- Scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 100, 1000000);
    camera.position.set(0, 0, 20000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 7000;
    controls.maxDistance = 200000;

    // --- Lighting ---
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(50000, 20000, 30000);
    scene.add(sun);

    // --- Star field ---
    (function buildStars() {
      const COUNT = 6000;
      const positions = new Float32Array(COUNT * 3);
      for (let i = 0; i < COUNT; i++) {
        const r = 400000 + Math.random() * 200000;
        const theta = Math.random() * 2 * Math.PI;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffffff,
        size: 300,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.85
      })));
    })();

    // --- Earth ---
    const textureLoader = new THREE.TextureLoader();
    textureLoader.crossOrigin = 'anonymous';
    const earthMesh = new THREE.Mesh(
      new THREE.SphereGeometry(6371, 64, 64),
      new THREE.MeshPhongMaterial({
        map: textureLoader.load(
          'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-day.jpg'
        )
      })
    );
    scene.add(earthMesh);

    // --- ISS marker ---
    const issMesh = new THREE.Mesh(
      new THREE.SphereGeometry(120, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x00ffff })
    );
    const issGlow = new THREE.PointLight(0x00ffff, 2, 3000);
    scene.add(issMesh);
    scene.add(issGlow);

    // --- Orbital trail ---
    const TRAIL_LENGTH = 200;
    const trailPositions = new Float32Array(TRAIL_LENGTH * 3);
    const trailGeometry = new THREE.BufferGeometry();
    trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
    trailGeometry.setDrawRange(0, 0);
    const trailLine = new THREE.Line(
      trailGeometry,
      new THREE.LineBasicMaterial({ color: 0x00ffff, opacity: 0.5, transparent: true })
    );
    scene.add(trailLine);

    let trailCount = 0;
    let trailHead = 0;

    function addTrailPoint(x, y, z) {
      const i = trailHead * 3;
      trailPositions[i]     = x;
      trailPositions[i + 1] = y;
      trailPositions[i + 2] = z;
      trailHead = (trailHead + 1) % TRAIL_LENGTH;
      trailCount = Math.min(trailCount + 1, TRAIL_LENGTH);

      const ordered = new Float32Array(trailCount * 3);
      for (let j = 0; j < trailCount; j++) {
        const src = ((trailHead - trailCount + j + TRAIL_LENGTH) % TRAIL_LENGTH) * 3;
        ordered[j * 3]     = trailPositions[src];
        ordered[j * 3 + 1] = trailPositions[src + 1];
        ordered[j * 3 + 2] = trailPositions[src + 2];
      }
      trailGeometry.setAttribute('position', new THREE.BufferAttribute(ordered, 3));
      trailGeometry.setDrawRange(0, trailCount);
      trailGeometry.attributes.position.needsUpdate = true;
    }

    // --- HUD ---
    const hudAlt = document.getElementById('hud-alt');
    const hudX   = document.getElementById('hud-x');
    const hudY   = document.getElementById('hud-y');
    const hudZ   = document.getElementById('hud-z');

    function updateHUD(pos) {
      const altitude = Math.sqrt(pos.x**2 + pos.y**2 + pos.z**2) - 6371;
      hudAlt.textContent = altitude.toFixed(1) + ' km';
      hudX.textContent   = pos.x.toFixed(1) + ' km';
      hudY.textContent   = pos.y.toFixed(1) + ' km';
      hudZ.textContent   = pos.z.toFixed(1) + ' km';
    }

    // --- All-satellite InstancedMesh ---
    let satInstancedMesh = null;
    let satRecords = [];
    let satNames = [];
    let satLastPositions = [];
    const dummy = new THREE.Object3D();
    const hiddenMatrix = new THREE.Matrix4().makeScale(0, 0, 0);

    function updateSatelliteInstances() {
      if (!satInstancedMesh || satRecords.length === 0) return;
      const now = new Date();
      for (let i = 0; i < satRecords.length; i++) {
        const pv = satellite.propagate(satRecords[i], now);
        const pos = pv.position;
        if (!pos || isNaN(pos.x)) {
          satInstancedMesh.setMatrixAt(i, hiddenMatrix);
          satLastPositions[i] = null;
        } else {
          dummy.position.set(pos.x, pos.z, -pos.y);
          dummy.updateMatrix();
          satInstancedMesh.setMatrixAt(i, dummy.matrix);
          satLastPositions[i] = pos;
        }
      }
      satInstancedMesh.instanceMatrix.needsUpdate = true;
    }

    async function initAllSatellites() {
      const response = await fetch('/api/satellites');
      if (!response.ok) { console.error('Satellite fetch error:', response.status); return; }
      const satellites = await response.json();

      const filtered = satellites.filter(s => s.name.trim().toUpperCase() !== 'ISS (ZARYA)');
      satNames = [];
      satRecords = [];
      for (const s of filtered) {
        try {
          const rec = satellite.twoline2satrec(s.line1, s.line2);
          satRecords.push(rec);
          satNames.push(s.name.trim());
        } catch (e) {}
      }
      satLastPositions = new Array(satRecords.length).fill(null);

      const count = satRecords.length;
      document.getElementById('hud-count').textContent = count.toLocaleString() + ' sats';
      console.log(`Rendering ${count} satellites via InstancedMesh`);

      satInstancedMesh = new THREE.InstancedMesh(
        new THREE.BoxGeometry(80, 80, 80),
        new THREE.MeshBasicMaterial({ color: 0xffcc00 }),
        count
      );
      satInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      for (let i = 0; i < count; i++) {
        satInstancedMesh.setMatrixAt(i, hiddenMatrix);
      }
      satInstancedMesh.instanceMatrix.needsUpdate = true;
      scene.add(satInstancedMesh);

      updateSatelliteInstances();
      setInterval(updateSatelliteInstances, 3000);
    }

    // --- Raycaster / tooltip ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip    = document.getElementById('tooltip');
    const ttName     = document.getElementById('tt-name');
    const ttAlt      = document.getElementById('tt-alt');

    renderer.domElement.addEventListener('mousemove', e => {
      if (!satInstancedMesh) return;

      mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(satInstancedMesh);

      if (hits.length > 0) {
        const id = hits[0].instanceId;
        const name = satNames[id] || 'Unknown';
        const pos  = satLastPositions[id];
        const alt  = pos
          ? (Math.sqrt(pos.x**2 + pos.y**2 + pos.z**2) - 6371).toFixed(1) + ' km'
          : '—';

        ttName.textContent = name;
        ttAlt.textContent  = 'ALT  ' + alt;
        tooltip.style.display = 'block';
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top  = e.clientY + 'px';
        document.body.style.cursor = 'crosshair';
      } else {
        tooltip.style.display = 'none';
        document.body.style.cursor = 'default';
      }
    });

    renderer.domElement.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
      document.body.style.cursor = 'default';
    });

    // --- Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Render loop ---
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();

    // --- ISS tracking ---
    let issRec = null;

    function updateISSMarker() {
      if (!issRec) return;
      const pv = satellite.propagate(issRec, new Date());
      const pos = pv.position;
      if (!pos) return;

      const x = pos.x, y = pos.z, z = -pos.y;
      issMesh.position.set(x, y, z);
      issGlow.position.set(x, y, z);
      addTrailPoint(x, y, z);
      updateHUD(pos);
    }

    async function initISS() {
      const response = await fetch('/api/satellites');
      if (!response.ok) { console.error('API error:', response.status); return; }
      const satellites = await response.json();

      const iss = satellites.find(s => s.name.trim().toUpperCase() === 'ISS (ZARYA)');
      if (!iss) { console.error('ISS not found'); return; }

      issRec = satellite.twoline2satrec(iss.line1, iss.line2);

      const now = Date.now();
      const ORBIT_MS = 92 * 60 * 1000;
      for (let t = now - ORBIT_MS; t <= now; t += 30000) {
        const pv = satellite.propagate(issRec, new Date(t));
        if (pv.position) addTrailPoint(pv.position.x, pv.position.z, -pv.position.y);
      }

      updateISSMarker();
      setInterval(updateISSMarker, 5000);
    }

    initISS();
    initAllSatellites();
  </script>
</body>
</html>
